<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Nature</title>
<style>
  :root {
    --bg: #12151b; --panel: #1a1f28; --panel2: #222834; --line: #2e3645;
    --text: #e6e9ef; --dim: #8b94a7; --faint: #566074;
    --good: #4ade80; --good-bg: #14532d; --bad: #f87171; --bad-bg: #7f1d1d;
    --warn: #fbbf24; --warn-bg: #713f12;
    --sym: #c4b5fd; --nav: #fcd34d; --accent: #60a5fa;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px 0 40px; }
  .brand { padding: 0 18px 14px; }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  .brand p { margin: 2px 0 0; color: var(--dim); font-size: 12px; }
  .track > button { all: unset; cursor: pointer; display: flex; width: 100%;
    justify-content: space-between; padding: 8px 18px; font-weight: 600;
    box-sizing: border-box; }
  .track > button:hover { background: var(--panel2); }
  .track .count { color: var(--dim); font-weight: 400; font-size: 12px; }
  .track ul { list-style: none; margin: 0 0 6px; padding: 0; display: none; }
  .track.open ul { display: block; }
  .track li { padding: 5px 18px 5px 30px; cursor: pointer; color: var(--dim);
    display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .track li:hover { background: var(--panel2); color: var(--text); }
  .track li.active { background: var(--panel2); color: var(--text);
    box-shadow: inset 3px 0 var(--accent); }
  .track li.done .tick { color: var(--good); }
  .track li .tick { color: transparent; flex: none; font-size: 12px; }
  main { overflow-y: auto; padding: 22px 32px 40px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; flex-wrap: wrap; }
  .top h2 { margin: 0; font-size: 21px; }
  .crumb { color: var(--dim); font-size: 12px; text-transform: uppercase;
    letter-spacing: .8px; }
  .stats { display: flex; gap: 18px; font-family: var(--mono); }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: .6px; font-family: system-ui, sans-serif; }
  .note { margin: 10px 0 14px; color: #c5cbd8; max-width: 70ch; }
  .code { position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 20px; font: 16px/1.75 var(--mono);
    white-space: pre; overflow-x: auto; min-height: 120px; }
  .line { min-height: 1.75em; }
  .cmt { color: var(--faint); font-style: italic; }
  .ch { color: var(--dim); border-radius: 3px; }
  .ch.done { color: var(--text); }
  .ch.slip { color: var(--warn); }
  .ch.cur { background: var(--accent); color: #0b1220; }
  .ch.cur.err { background: var(--bad); color: #fff; }
  .ch.ret { color: var(--faint); margin-left: 4px; }
  .ch.ret.done { color: var(--faint); opacity: .4; }
  .echo { margin-top: 10px; display: flex; align-items: baseline; gap: 12px;
    background: #0d1015; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 20px; font: 16px/1.6 var(--mono); min-height: 48px; }
  .echo.miss { border-color: var(--bad); }
  .echo-lbl { flex: none; font: 11px system-ui, sans-serif; color: var(--faint);
    text-transform: uppercase; letter-spacing: .8px; width: 74px; white-space: nowrap; }
  .echo-txt { white-space: pre-wrap; word-break: break-all; }
  .echo-txt .t { color: var(--text); }
  .echo-txt .w { color: #fff; background: var(--bad-bg); border-bottom: 2px solid var(--bad);
    border-radius: 3px; padding: 0 2px; margin-left: 1px; }
  .echo-txt .w.long { font-size: 12px; padding: 1px 5px; vertical-align: 2px; }
  .echo-txt .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent);
    vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  .echo.miss .caret { background: var(--bad); }
  .echo-txt .hint { color: var(--faint); font-family: system-ui, sans-serif; font-size: 13px; }
  @keyframes blink { 50% { opacity: 0; } }
  .fb { margin-top: 12px; min-height: 86px; border-radius: 10px; padding: 12px 16px;
    background: var(--panel); border: 1px solid var(--line); }
  .fb.miss { border-color: var(--bad); background: #23181b; }
  .fb-row { display: flex; align-items: center; gap: 12px; margin: 2px 0; }
  .fb-lbl { width: 70px; color: var(--dim); font-size: 12px; text-transform: uppercase;
    letter-spacing: .6px; }
  kbd { font: 600 18px var(--mono); min-width: 38px; text-align: center;
    padding: 3px 9px; border-radius: 6px; background: var(--panel2);
    border: 1px solid var(--line); }
  kbd.good { background: var(--good-bg); border-color: var(--good); color: #d1fae5; }
  kbd.bad { background: var(--bad-bg); border-color: var(--bad); color: #fee2e2; }
  .how { font-family: var(--mono); font-size: 13px; }
  .hint { margin-top: 6px; font-weight: 600; color: #fecaca; }
  .fb .quiet { color: var(--dim); }

  .kb-wrap { margin-top: 14px; overflow: hidden; }
  .kb { position: relative; width: 790px; height: 262px; margin: 0 auto; }
  .key { position: absolute; width: 54px; height: 54px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--line); }
  .key .b { position: absolute; left: 9px; bottom: 5px; font: 600 17px var(--mono); }
  .key .s { position: absolute; right: 6px; top: 3px; font: 12px var(--mono);
    color: var(--sym); opacity: .75; }
  .key .n { position: absolute; right: 6px; bottom: 4px; font: 12px var(--mono);
    color: var(--nav); opacity: .75; }
  .key .m { position: absolute; left: 6px; top: 3px; font: 10px system-ui;
    color: var(--faint); }
  .key.thumb .b { font-size: 13px; left: 0; right: 0; bottom: 17px; text-align: center; }
  .key.target { background: var(--good-bg); border-color: var(--good); }
  .key.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .key.wrong-mod { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }
  .key.target-mod { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
  .key.target-alt { border: 2px dashed var(--good); }
  .key.samekey { background: var(--warn-bg); border-color: var(--warn); }
  .key .hot-good { color: #fff; opacity: 1; font-weight: 700;
    text-shadow: 0 0 8px var(--good); }
  .key .hot-bad { color: #fff; opacity: 1; font-weight: 700;
    text-shadow: 0 0 8px var(--bad); }
  .legend { display: flex; gap: 16px; justify-content: center; color: var(--dim);
    font-size: 12px; margin-top: 4px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    margin-right: 5px; vertical-align: -1px; }
  .bar { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .btn { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 7px;
    background: var(--panel2); border: 1px solid var(--line); font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #0b1220; border-color: var(--accent);
    font-weight: 600; }
  .weak { margin-top: 18px; }
  .weak h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--dim); margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 10px; font-size: 12px; color: var(--dim); }
  .chip b { font: 600 15px var(--mono); color: var(--text); margin-right: 6px; }
  .result { position: absolute; inset: 0; background: rgba(18, 21, 27, .97);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; border-radius: 10px; font-family: system-ui, sans-serif;
    white-space: normal; text-align: center; }
  .result .big { font: 700 34px var(--mono); }
  .result .sub { color: var(--dim); }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Second Nature</h1>
      <p>Type the code until you stop thinking about it.</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="wrap">
      <div class="top">
        <div>
          <div class="crumb" id="crumb"></div>
          <h2 id="title"></h2>
        </div>
        <div class="stats">
          <div class="stat"><b id="s-wpm">0</b><span>wpm</span></div>
          <div class="stat"><b id="s-acc">100%</b><span>accuracy</span></div>
          <div class="stat"><b id="s-prog">0%</b><span>done</span></div>
          <div class="stat"><b id="s-best">–</b><span>best wpm</span></div>
        </div>
      </div>
      <p class="note" id="note"></p>
      <div class="code" id="code"></div>
      <div class="echo" id="echo"><span class="echo-lbl">you typed</span><span class="echo-txt" id="echo-txt"></span></div>
      <div class="fb" id="fb"></div>
      <div class="kb-wrap"><div class="kb" id="kb"></div></div>
      <div class="legend">
        <span><i style="background:var(--good)"></i>key to press</span>
        <span><i style="background:var(--bad)"></i>key you hit</span>
        <span><i style="background:var(--warn)"></i>right key, wrong layer or shift</span>
        <span><i style="background:var(--sym)"></i>SYM layer</span>
        <span><i style="background:var(--nav)"></i>NUM layer</span>
        <span><i style="border:1.5px dashed var(--good)"></i>other way to type it</span>
      </div>
      <div class="bar">
        <button class="btn" id="b-restart">Restart lesson (Esc)</button>
        <button class="btn" id="b-next">Next lesson</button>
        <button class="btn" id="b-guide"></button>
        <button class="btn" id="b-drill">Drill my weak keys</button>
        <button class="btn" id="b-reset" style="margin-left:auto">Reset progress</button>
      </div>
      <div class="weak">
        <h3>Your weakest keys</h3>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </main>
</div>

<script src="lessons.js"></script>
<script>
/* ---------- Your Corne keymap (zmk-config-corne, master) ---------- */
const BASE = [
  ['`','q','w','e','r','t','y','u','i','o','p','⌫'],
  ['⇥','a','s','d','f','g','h','j','k','l',';',"'"],
  ['⇧','z','x','c','v','b','n','m',',','.','/','⇧'],
];
// Read live from the keyboard through ZMK Studio (CorneWireless).
// SYM = "Symbols_Navigation", held on the right middle thumb (tap: tab).
const SYM = [
  [null,'!','@','#','$','%','pgup','&','↑',null,'home',null],
  [null,'^','&','*','(',')','pgdn','←','↓','→','end',null],
  [null,null,null,'←','→','~','_',null,null,null,null,null],
];
// NUM = "Numbers_Symbols", held on the left middle thumb.
const NUM = [
  ['esc','1','2','3','4','5','6','7','|','(',')',null],
  ['caps','6','7','8','9','0','-','=','*','{','}','home'],
  [null,null,null,'*','/',null,'_','+','\\','[',']','end'],
];
const HOLD = { '2,1':'ctrl','2,2':'alt','2,3':'cmd','2,4':'globe',
               '2,7':'globe','2,8':'cmd','2,9':'alt','2,10':'ctrl' };
const THUMBS = ['⌘','NUM','space','enter','SYM','⌥'];
const T_NUM = 1, T_SPACE = 2, T_ENTER = 3, T_SYM = 4;
const SHIFTED = { '`':'~', ';':':', "'":'"', ',':'<', '.':'>', '/':'?' };
const NAMED = {
  ArrowUp:{layer:'sym',r:0,c:8}, ArrowLeft:{layer:'sym',r:1,c:7},
  ArrowDown:{layer:'sym',r:1,c:8}, ArrowRight:{layer:'sym',r:1,c:9},
  PageUp:{layer:'sym',r:0,c:6}, PageDown:{layer:'sym',r:1,c:6},
  Home:{layer:'sym',r:0,c:10}, End:{layer:'sym',r:1,c:10},
};
const NAMED_LABEL = { ArrowUp:'↑', ArrowLeft:'←', ArrowDown:'↓', ArrowRight:'→',
  PageUp:'PgUp', PageDown:'PgDn', Home:'Home', End:'End' };

const CHARMAP = (() => {
  const m = {};
  const add = (ch, loc) => (m[ch] = m[ch] || []).push(loc);
  const plain = k => k && k.length === 1 && !'⌫⇥⇧↑←↓→'.includes(k);
  BASE.forEach((row, r) => row.forEach((k, c) => plain(k) && add(k, {layer:'base', r, c})));
  NUM.forEach((row, r) => row.forEach((k, c) => plain(k) && add(k, {layer:'num', r, c})));
  SYM.forEach((row, r) => row.forEach((k, c) => plain(k) && add(k, {layer:'sym', r, c})));
  BASE.forEach((row, r) => row.forEach((k, c) => {
    if (/^[a-z]$/.test(k)) add(k.toUpperCase(), {layer:'base', r, c, shift:true});
    if (SHIFTED[k]) add(SHIFTED[k], {layer:'base', r, c, shift:true});
  }));
  m[' '] = [{thumb: T_SPACE}];
  m['\n'] = [{thumb: T_ENTER}];
  m['\t'] = [{thumb: T_SYM, tap: true}, {layer:'base', r:1, c:0}];
  return m;
})();

/* ---------- Keyboard drawing ---------- */
const U = 58, STAG = [20, 20, 8, 0, 8, 14], SPLIT = 94;
const kbEl = document.getElementById('kb');
const keyEls = {};
function keyXY(r, c) {
  const left = c < 6;
  const x = left ? c * U : 6 * U + SPLIT + (c - 6) * U;
  const y = STAG[left ? c : 11 - c] + r * U;
  return [x, y];
}
function buildKeyboard() {
  for (let r = 0; r < 3; r++) for (let c = 0; c < 12; c++) {
    const [x, y] = keyXY(r, c);
    const el = document.createElement('div');
    el.className = 'key';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    const b = BASE[r][c], s = SYM[r][c], n = NUM[r][c], h = HOLD[r + ',' + c];
    el.innerHTML = `<span class="b">${esc(b.length === 1 ? b.toUpperCase() : b)}</span>` +
      (s ? `<span class="s"${s.length > 1 ? ' style="font-size:9px"' : ''}>${esc(s)}</span>` : '') +
      (n ? `<span class="n"${n.length > 1 ? ' style="font-size:9px"' : ''}>${esc(n)}</span>` : '') +
      (h ? `<span class="m">${h}</span>` : '');
    kbEl.appendChild(el);
    keyEls[r + ',' + c] = el;
  }
  const tx = [3.6 * U, 4.6 * U, 5.6 * U, 6 * U + SPLIT - 0.6 * U, 6 * U + SPLIT + 0.4 * U, 6 * U + SPLIT + 1.4 * U];
  const ty = [0, 4, 12, 12, 4, 0];
  THUMBS.forEach((label, i) => {
    const el = document.createElement('div');
    el.className = 'key thumb';
    el.style.left = tx[i] + 'px'; el.style.top = (3 * U + 22 + ty[i]) + 'px';
    el.innerHTML = `<span class="b">${label}</span>` + (i === T_SYM ? '<span class="m">tap: tab</span>' : '') +
      (i === T_SPACE || i === T_ENTER ? '<span class="m">ctrl</span>' : '');
    if (i === T_SYM) el.querySelector('.b').style.color = 'var(--sym)';
    if (i === T_NUM) el.querySelector('.b').style.color = 'var(--nav)';
    kbEl.appendChild(el);
    keyEls['t' + i] = el;
  });
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function locEl(loc) { return loc.thumb !== undefined ? keyEls['t' + loc.thumb] : keyEls[loc.r + ',' + loc.c]; }
function sameKey(a, b) {
  if (a.thumb !== undefined || b.thumb !== undefined) return a.thumb === b.thumb;
  return a.r === b.r && a.c === b.c;
}
function clearKB() {
  Object.values(keyEls).forEach(el => {
    el.classList.remove('target', 'target-mod', 'target-alt', 'wrong', 'wrong-mod', 'samekey');
    el.querySelectorAll('.hot-good,.hot-bad').forEach(s => s.classList.remove('hot-good', 'hot-bad'));
  });
}
function paintLoc(loc, kind) {           // kind: 'target' | 'wrong'
  const el = locEl(loc);
  el.classList.add(kind);
  const hot = kind === 'target' ? 'hot-good' : 'hot-bad';
  if (loc.thumb === undefined) {
    const sel = loc.layer === 'sym' ? '.s' : loc.layer === 'num' ? '.n' : '.b';
    const lg = el.querySelector(sel); if (lg) lg.classList.add(hot);
    if (loc.layer === 'sym') keyEls['t' + T_SYM].classList.add(kind + '-mod');
    if (loc.layer === 'num') keyEls['t' + T_NUM].classList.add(kind + '-mod');
    if (loc.shift)                     // shift lives on the pinkies: use the opposite hand
      keyEls[loc.c < 6 ? '2,11' : '2,0'].classList.add(kind + '-mod');
  }
}
function paint(expLoc, hitLoc, altLoc) {
  clearKB();
  if (altLoc && altLoc.thumb === undefined && !(expLoc && sameKey(expLoc, altLoc)))
    locEl(altLoc).classList.add('target-alt');
  if (expLoc) paintLoc(expLoc, 'target');
  if (hitLoc) {
    paintLoc(hitLoc, 'wrong');
    if (expLoc && sameKey(expLoc, hitLoc)) {
      const el = locEl(hitLoc);
      el.classList.remove('target', 'wrong'); el.classList.add('samekey');
    }
  }
}

/* ---------- Describing keys and mistakes ---------- */
function charName(ch) {
  return ch === ' ' ? 'space' : ch === '\n' ? '⏎' : ch === '\t' ? 'tab' : ch;
}
function describe(loc) {
  if (!loc) return 'not on your BASE, SYM or NAV layers';
  if (loc.thumb !== undefined) {
    if (loc.thumb === T_SYM) return 'SYM thumb, tapped (right middle thumb)';
    if (loc.thumb === T_SPACE) return 'space (left inner thumb)';
    if (loc.thumb === T_ENTER) return 'enter (right inner thumb)';
    return THUMBS[loc.thumb] + ' thumb';
  }
  const pos = BASE[loc.r][loc.c];
  const posName = pos.length === 1 ? pos.toUpperCase() : pos === '⌫' ? 'backspace' : pos === '⇥' ? 'tab' : 'shift';
  const hand = loc.c < 6 ? 'left' : 'right';
  if (loc.layer === 'sym') return `hold SYM + ${posName} position (${hand} hand)`;
  if (loc.layer === 'num') return `hold NUM + ${posName} position (${hand} hand)`;
  if (loc.shift) return `shift + ${posName} (${hand} hand, base layer)`;
  return `${posName} (${hand} hand, base layer)`;
}
function pickLoc(locs, expLoc) {
  if (!locs || !locs.length) return null;
  if (!expLoc || expLoc.thumb !== undefined) return locs[0];
  let best = locs[0], bestCost = Infinity;
  for (const l of locs) {
    if (l.thumb !== undefined) continue;
    const cost = Math.abs(l.r - expLoc.r) + Math.abs(l.c - expLoc.c) + (l.layer === expLoc.layer ? 0 : 0.5);
    if (cost < bestCost) { best = l; bestCost = cost; }
  }
  return best;
}
const LAYER_NAME = { base: 'the base layer', sym: 'SYM', num: 'NUM' };
// A second way to make the same character (e.g. "(" is on both NUM and SYM).
function altLoc(ch) {
  const locs = CHARMAP[ch] || [];
  return locs.find((l, i) => i > 0 && l.thumb === undefined && !l.shift && !sameKey(l, locs[0])) || null;
}
function diagnose(expCh, expLoc, hitCh, hitLoc, ev) {
  if (ev && (ev.ctrlKey || ev.altKey || ev.key === 'Dead'))
    return `A modifier fired (${ev.ctrlKey ? 'ctrl' : 'alt'}). Space, enter and the bottom-row keys turn into modifiers when held. Tap it quicker.`;
  if (hitCh === '\t' && expLoc && expLoc.layer === 'sym')
    return 'You tapped the SYM thumb, which sends Tab. Keep it held down, then press the key.';
  if (hitCh === '\t')
    return 'That was Tab, from tapping the SYM thumb.' + (expLoc && expLoc.layer === 'num' ? ' This one needs NUM, the left middle thumb.' : '');
  if (!hitLoc) return 'That key is not on your BASE, SYM or NAV layers.';
  if (!expLoc) return '';
  if (expLoc.thumb !== undefined || hitLoc.thumb !== undefined) {
    if (expCh === '\n') return 'End of the line: press enter.';
    if (expCh === ' ') return 'A space comes next.';
    if (hitCh === ' ') return 'You hit space. The next character is not a space.';
    if (hitCh === '\n') return 'You hit enter before the line was finished.';
    return '';
  }
  if (sameKey(expLoc, hitLoc)) {
    if (expLoc.layer !== hitLoc.layer) {
      const need = expLoc.layer === 'base' ? 'Let go of the layer thumb.'
        : `Hold ${LAYER_NAME[expLoc.layer]} (${expLoc.layer === 'sym' ? 'right' : 'left'} middle thumb) first.`;
      return `Right key, wrong layer. It arrived from ${LAYER_NAME[hitLoc.layer]}. ${need}`;
    }
    if (expLoc.shift && !hitLoc.shift) return 'Right key, but shift was missing.';
    if (!expLoc.shift && hitLoc.shift) return 'Right key, but shift was held. Let go of shift.';
  }
  const dc = hitLoc.c - expLoc.c, dr = hitLoc.r - expLoc.r;
  const parts = [];
  const otherHand = (expLoc.c < 6) !== (hitLoc.c < 6);
  if (!otherHand) {
    if (dc) parts.push(`${Math.abs(dc)} column${Math.abs(dc) > 1 ? 's' : ''} too far ${dc > 0 ? 'right' : 'left'}`);
    if (dr) parts.push(`${Math.abs(dr)} row${Math.abs(dr) > 1 ? 's' : ''} too ${dr > 0 ? 'low' : 'high'}`);
  }
  let msg = otherHand ? `Wrong hand: the key is under your ${expLoc.c < 6 ? 'left' : 'right'} hand.`
    : parts.length ? 'Your finger landed ' + parts.join(' and ') + '.' : '';
  if (expLoc.layer !== hitLoc.layer)
    msg += ` Wrong layer too: you were on ${LAYER_NAME[hitLoc.layer]}, it needs ${LAYER_NAME[expLoc.layer]}.`;
  else if (!!expLoc.shift !== !!hitLoc.shift)
    msg += expLoc.shift ? ' Shift was missing too.' : ' Shift was held too.';
  return msg.trim();
}

/* ---------- Saved progress ---------- */
const STORE = 'second-nature-v1';
let save = { lessons: {}, keys: {}, conf: {}, guide: true, last: null };
try { Object.assign(save, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
function persist() { try { localStorage.setItem(STORE, JSON.stringify(save)); } catch (e) {} }

/* ---------- Lesson engine ---------- */
const $ = id => document.getElementById(id);
const codeEl = $('code'), fbEl = $('fb');
const ALL = [];
TRACKS.forEach(tr => tr.lessons.forEach((ls, i) => {
  ls.id = tr.id + '-' + i; ls.track = tr; ALL.push(ls);
}));
let cur = null, seq = [], pos = 0, startAt = 0, endAt = 0, slips = new Set(), finished = false, timer = null;
let wrongs = [];                 // keys hit at this position since the last correct one

// The line you are typing, echoed back with every wrong key shown where it landed.
function renderEcho() {
  let from = pos;
  while (from > 0 && seq[from - 1].ch !== '\n') from--;
  const typed = seq.slice(from, pos).map(s => s.ch).join('');
  const html = [];
  if (typed) html.push(`<span class="t">${esc(typed)}</span>`);
  wrongs.slice(-6).forEach(w => {
    const long = [...w].length > 1;
    html.push(`<span class="w${long ? ' long' : ''}">${esc(w === ' ' ? '␣' : w)}</span>`);
  });
  html.push('<span class="caret"></span>');
  if (!typed && !wrongs.length) html.push(' <span class="hint">start typing</span>');
  $('echo-txt').innerHTML = html.join('');
  $('echo').classList.toggle('miss', wrongs.length > 0);
}

const isNote = line => /^(#|--)(\s|$)/.test(line.trim());
function loadLesson(lesson) {
  cur = lesson; seq = []; pos = 0; startAt = 0; endAt = 0; slips = new Set(); finished = false; wrongs = [];
  clearInterval(timer);
  $('crumb').textContent = lesson.track ? lesson.track.name : 'Practice';
  $('title').textContent = lesson.t;
  $('note').textContent = lesson.n;
  codeEl.innerHTML = '';
  const lines = lesson.c.split('\n');
  const typeable = lines.map(l => l.trim() !== '' && !isNote(l));
  const last = typeable.lastIndexOf(true);
  lines.forEach((line, li) => {
    const div = document.createElement('div');
    div.className = 'line';
    if (!typeable[li]) {
      div.innerHTML = `<span class="cmt">${esc(line) || ' '}</span>`;
    } else {
      const indent = line.match(/^\s*/)[0];
      div.appendChild(document.createTextNode(indent));
      for (const ch of line.slice(indent.length)) {
        const sp = document.createElement('span');
        sp.className = 'ch'; sp.textContent = ch;
        div.appendChild(sp); seq.push({ ch, el: sp });
      }
      if (li !== last) {
        const sp = document.createElement('span');
        sp.className = 'ch ret'; sp.textContent = '⏎';
        div.appendChild(sp); seq.push({ ch: '\n', el: sp });
      }
    }
    codeEl.appendChild(div);
  });
  if (lesson.track) { save.last = lesson.id; persist(); }
  markCursor(); showNext(); renderStats(); renderNav(); renderEcho();
}
function markCursor() {
  if (seq[pos]) {
    seq[pos].el.classList.add('cur');
    seq[pos].el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
}
function showNext() {
  fbEl.className = 'fb';
  if (finished || !seq[pos]) { clearKB(); return; }
  const ch = seq[pos].ch, loc = (CHARMAP[ch] || [])[0];
  if (!save.guide) {
    clearKB();
    fbEl.innerHTML = '<div class="quiet">Key guide is off. A wrong key will still show here and on the keyboard.</div>';
    return;
  }
  const alt = altLoc(ch);
  paint(loc, null, alt);
  fbEl.innerHTML = `<div class="fb-row"><span class="fb-lbl">next</span>` +
    `<kbd>${esc(charName(ch))}</kbd><span class="how">${describe(loc)}</span></div>` +
    (alt ? `<div class="fb-row"><span class="fb-lbl">or</span><span class="how quiet">${describe(alt)}</span></div>` : '');
}
function showMiss(expCh, hitCh, hitLabel, ev) {
  let expLoc = (CHARMAP[expCh] || [])[0];
  const symTap = hitCh === '\t';   // the SYM thumb sends tab when tapped
  const hitLoc = NAMED[ev.key] || (symTap ? CHARMAP['\t'][0] : pickLoc(CHARMAP[hitCh], expLoc));
  const modFired = ev.ctrlKey || ev.altKey || ev.key === 'Dead';
  // If the character has two homes, compare against the one nearer to what was hit.
  const alt = altLoc(expCh);
  if (alt && hitLoc && hitLoc.thumb === undefined && expLoc.thumb === undefined) {
    const d = l => Math.abs(l.r - hitLoc.r) + Math.abs(l.c - hitLoc.c) + (l.layer === hitLoc.layer ? 0 : 0.5);
    if (d(alt) < d(expLoc)) expLoc = alt;
  }
  paint(expLoc, modFired ? null : hitLoc);
  const hint = diagnose(expCh, expLoc, hitCh, hitLoc, ev);
  fbEl.className = 'fb miss';
  fbEl.innerHTML =
    `<div class="fb-row"><span class="fb-lbl">expected</span><kbd class="good">${esc(charName(expCh))}</kbd>` +
    `<span class="how">${describe(expLoc)}</span></div>` +
    `<div class="fb-row"><span class="fb-lbl">you hit</span><kbd class="bad">${esc(hitLabel)}</kbd>` +
    `<span class="how">${modFired ? 'with a modifier held' : describe(hitLoc)}</span></div>` +
    (hint ? `<div class="hint">${esc(hint)}</div>` : '');
}
function record(expCh, hitLabel, ok) {
  const k = save.keys[expCh] = save.keys[expCh] || { h: 0, m: 0 };
  if (ok) k.h++; else {
    k.m++;
    const c = expCh + '\u0000' + hitLabel;
    save.conf[c] = (save.conf[c] || 0) + 1;
  }
}
function onKey(e) {
  if (e.metaKey) return;
  const k = e.key;
  if (k === 'Escape') { e.preventDefault(); loadLesson(cur); return; }
  if (finished) {
    if (k === 'Enter') { e.preventDefault(); nextLesson(); }
    if (k === 'r' || k === 'R') { e.preventDefault(); loadLesson(cur); }
    return;
  }
  if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(k)) return;
  if (k === 'Backspace') { e.preventDefault(); return; }   // nothing to delete: you can't advance past a miss
  let ch = k === 'Enter' ? '\n' : k === 'Tab' ? '\t' : k.length === 1 ? k : null;
  const named = NAMED[k], dead = k === 'Dead';
  if (ch === null && !named && !dead) return;
  e.preventDefault();
  if (!seq[pos]) return;
  if (!startAt) { startAt = performance.now(); timer = setInterval(renderStats, 500); }
  const exp = seq[pos];
  const modFired = e.ctrlKey || e.altKey || dead;
  if (ch === exp.ch && !modFired) {
    if (!slips.has(pos)) record(exp.ch, '', true);
    exp.el.classList.remove('cur', 'err');
    exp.el.classList.add('done');
    if (slips.has(pos)) exp.el.classList.add('slip');
    pos++; wrongs = [];
    renderEcho();
    if (pos >= seq.length) return finish();
    markCursor(); showNext(); renderStats();
    return;
  }
  const label = named ? NAMED_LABEL[k] : dead ? 'alt+key' : modFired ? (e.ctrlKey ? 'ctrl+' : 'alt+') + charName(ch) : charName(ch);
  if (!slips.has(pos)) { slips.add(pos); record(exp.ch, label, false); persist(); }
  exp.el.classList.add('err');
  wrongs.push(label); renderEcho();
  showMiss(exp.ch, ch, label, e);
  renderStats();
}
function liveNumbers() {
  const t = ((endAt || performance.now()) - (startAt || performance.now())) / 60000;
  const wpm = t > 0 ? Math.round(pos / 5 / t) : 0;
  const acc = pos + slips.size > 0 ? Math.round(100 * (Math.max(pos, 1) - [...slips].filter(p => p < Math.max(pos, 1)).length) / Math.max(pos, 1)) : 100;
  return { wpm, acc };
}
function renderStats() {
  const { wpm, acc } = liveNumbers();
  $('s-wpm').textContent = wpm;
  $('s-acc').textContent = acc + '%';
  $('s-prog').textContent = (seq.length ? Math.round(100 * pos / seq.length) : 0) + '%';
  const rec = cur && save.lessons[cur.id];
  $('s-best').textContent = rec ? rec.best : '–';
}
function finish() {
  finished = true; endAt = performance.now(); clearInterval(timer);
  const { wpm } = liveNumbers();
  const acc = Math.round(100 * (seq.length - slips.size) / seq.length);
  if (cur.track) {
    const rec = save.lessons[cur.id] = save.lessons[cur.id] || { best: 0, acc: 0, runs: 0 };
    rec.runs++; rec.best = Math.max(rec.best, wpm); rec.acc = Math.max(rec.acc, acc);
  }
  persist(); renderStats(); renderNav(); renderChips(); clearKB();
  const missed = {};
  slips.forEach(p => missed[seq[p].ch] = (missed[seq[p].ch] || 0) + 1);
  const top = Object.entries(missed).sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([c, n]) => `<kbd>${esc(charName(c))}</kbd> ×${n}`).join('&nbsp; ');
  const div = document.createElement('div');
  div.className = 'result';
  div.innerHTML = `<div class="big">${wpm} wpm · ${acc}%</div>` +
    `<div class="sub">${slips.size ? 'Slipped on: ' + top : 'No slips. Clean run.'}</div>` +
    `<div class="sub">${acc < 95 ? 'Under 95% accuracy: repeat it slower before moving on.' : 'Enter for the next lesson, R to repeat.'}</div>` +
    `<div><button class="btn primary" id="r-next">Next lesson ⏎</button> <button class="btn" id="r-again">Repeat (R)</button></div>`;
  codeEl.appendChild(div);
  $('r-next').onclick = nextLesson; $('r-again').onclick = () => loadLesson(cur);
  fbEl.className = 'fb'; fbEl.innerHTML = '<div class="quiet">Lesson complete.</div>';
}
function nextLesson() {
  const i = ALL.indexOf(cur);
  loadLesson(ALL[(i + 1) % ALL.length] || ALL[0]);
}

/* ---------- Weak keys ---------- */
function weakKeys(n) {
  return Object.entries(save.keys)
    .filter(([c, v]) => v.m >= 2 && c !== '\n' && c !== ' ')
    .map(([c, v]) => ({ c, rate: v.m / (v.h + v.m), m: v.m }))
    .sort((a, b) => b.rate - a.rate || b.m - a.m).slice(0, n);
}
function renderChips() {
  const weak = weakKeys(10);
  if (!weak.length) {
    $('chips').innerHTML = '<span class="chip">Nothing yet. Keys you miss twice or more show up here.</span>';
    return;
  }
  $('chips').innerHTML = weak.map(w => {
    let worst = null, worstN = 0;
    for (const [k, n] of Object.entries(save.conf)) {
      const [e, h] = k.split('\u0000');
      if (e === w.c && n > worstN) { worst = h; worstN = n; }
    }
    return `<span class="chip"><b>${esc(charName(w.c))}</b>${Math.round(100 * (1 - w.rate))}% right` +
      (worst ? ` · you usually hit <b style="margin:0 0 0 4px">${esc(worst)}</b>` : '') + `</span>`;
  }).join('');
}
function drill() {
  const weak = weakKeys(6).map(w => w.c);
  if (!weak.length) {
    fbEl.className = 'fb';
    fbEl.innerHTML = '<div class="quiet">No weak keys recorded yet. Finish a few lessons first.</div>';
    return;
  }
  const pool = [];
  ALL.forEach(ls => ls.c.split('\n').forEach(line => {
    const t = line.trim();
    if (!t || isNote(t) || t.length > 64) return;
    const score = [...t].filter(ch => weak.includes(ch)).length;
    if (score) pool.push({ t, score: score / Math.sqrt(t.length) });
  }));
  pool.sort((a, b) => b.score - a.score);
  const pick = [...new Set(pool.slice(0, 40).map(p => p.t))].sort(() => Math.random() - 0.5).slice(0, 8);
  loadLesson({ id: 'drill', t: 'Weak-key drill', track: null,
    n: 'Lines pulled from across the course that are heavy in: ' + weak.map(charName).join('  '),
    c: pick.join('\n') });
}

/* ---------- Sidebar ---------- */
function renderNav() {
  const nav = $('nav');
  const open = new Set([...nav.querySelectorAll('.track.open')].map(el => el.dataset.id));
  if (cur && cur.track) open.add(cur.track.id);
  nav.innerHTML = '';
  TRACKS.forEach(tr => {
    const done = tr.lessons.filter(l => save.lessons[l.id]).length;
    const div = document.createElement('div');
    div.className = 'track' + (open.has(tr.id) ? ' open' : '');
    div.dataset.id = tr.id;
    div.innerHTML = `<button title="${esc(tr.blurb)}"><span>${esc(tr.name)}</span><span class="count">${done}/${tr.lessons.length}</span></button><ul></ul>`;
    div.querySelector('button').onclick = ev => { div.classList.toggle('open'); ev.currentTarget.blur(); };
    const ul = div.querySelector('ul');
    tr.lessons.forEach(ls => {
      const li = document.createElement('li');
      const rec = save.lessons[ls.id];
      li.className = (rec ? 'done ' : '') + (cur === ls ? 'active' : '');
      li.innerHTML = `<span>${esc(ls.t)}</span><span class="tick">${rec ? rec.best + ' ✓' : '✓'}</span>`;
      li.onclick = () => loadLesson(ls);
      ul.appendChild(li);
    });
    nav.appendChild(div);
  });
}

/* ---------- Buttons ---------- */
function wire(id, fn) { $(id).onclick = ev => { ev.currentTarget.blur(); fn(ev); }; }
function guideLabel() { $('b-guide').textContent = 'Key guide: ' + (save.guide ? 'on' : 'off'); }
wire('b-restart', () => loadLesson(cur));
wire('b-next', nextLesson);
wire('b-drill', drill);
wire('b-guide', () => { save.guide = !save.guide; persist(); guideLabel(); showNext(); });
let resetArmed = 0;
wire('b-reset', () => {
  if (Date.now() - resetArmed < 4000) {
    save = { lessons: {}, keys: {}, conf: {}, guide: save.guide, last: null };
    persist(); resetArmed = 0; $('b-reset').textContent = 'Reset progress';
    renderChips(); loadLesson(ALL[0]);
  } else { resetArmed = Date.now(); $('b-reset').textContent = 'Click again to erase everything'; }
});

function fitKeyboard() {
  const w = kbEl.parentElement.clientWidth;
  kbEl.style.zoom = Math.min(1, w / 790);
}
window.addEventListener('resize', fitKeyboard);
buildKeyboard(); fitKeyboard(); guideLabel(); renderChips();
document.addEventListener('keydown', onKey);
loadLesson(ALL.find(l => l.id === save.last) || ALL[0]);
</script>
</body>
</html>
